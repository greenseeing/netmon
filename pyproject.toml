[project]
name = "netmon"
dynamic = ["version"]
description = "Passive network monitor: DNS, TLS SNI, HTTP hosts, and connection flows with timestamped JSONL logging"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "greenseer" }]
dependencies = [
    "scapy>=2.6.1",
    "pydantic>=2.11",
    "structlog>=25.1",
    "cryptography>=44",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]

[project.urls]
Homepage = "https://github.com/greenseeing/netmon"
Repository = "https://github.com/greenseeing/netmon"

[project.scripts]
netmon = "netmon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: __version__ in netmon.py.
# scripts/release.sh bumps only that line; package metadata is read from it.
[tool.hatch.version]
path = "netmon.py"

[tool.hatch.build.targets.wheel]
# hatchling auto-detects netmon.py from the script name but misses the sibling
# module, so --tui would break in an installed copy without listing it here.
include = ["netmon.py", "netmon_tui.py"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "textual>=0.80",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
